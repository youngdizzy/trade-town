# Production configuration. Run with: docker compose up --build
#
# Exposes a single port (80, or $HTTP_PORT) via the frontend's bundled
# nginx, which serves the built SPA and reverse-proxies /api and /ws to the
# backend. The backend is not published to the host — it's only reachable
# over the internal Docker network, matching a standard VPS deployment
# behind nginx. Override any variable below via a root-level .env file
# (see .env.example) rather than editing this file.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/tradetown.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-2.0}
      GAME_MINUTES_PER_TICK: ${GAME_MINUTES_PER_TICK:-5}
      PERSIST_INTERVAL_TICKS: ${PERSIST_INTERVAL_TICKS:-15}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - tradetown-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  tradetown-data:
