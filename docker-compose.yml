# Production configuration. Run with: docker compose up -d --build
#
# Exposes a single port (80, or $HTTP_PORT) via the frontend's bundled
# nginx, which serves the built SPA and reverse-proxies /api and /ws to the
# backend. The backend is not published to the host — it's only reachable
# over the internal Docker network, matching a standard VPS deployment
# behind nginx. Override any variable below via a root-level .env file
# (see .env.example) rather than editing this file. No .env file is
# required to run — every variable has a sensible default.
#
# TradeTown Read-Only MCP Boundary 1.0 — TWO deployment changes:
#
# 1. HTTP_BIND (default 127.0.0.1). The frontend's host port is now bound to
#    loopback, NOT 0.0.0.0. /api and /ws have no authentication of their own
#    (docs/API.md: "There is no authentication — the app is single-tenant by
#    design"), and /ws broadcasts full game state, so publishing them on all
#    interfaces put the entire unauthenticated surface on the public internet.
#    Reach the UI over an SSH tunnel: ssh -L 8080:127.0.0.1:80 <vps>
#    A host firewall is NOT an adequate substitute here: Docker's published
#    ports install DNAT rules that bypass ufw's INPUT chain, so `ufw deny 80`
#    would appear to work while the port stayed open. Removing the public
#    listener is the real control.
#
# 2. mcp-service. An isolated, read-only MCP server for the external
#    tt-scout agent. It has NO host port, and it CANNOT reach backend:8000 —
#    it talks only to the frontend nginx's internal GET-allowlist listener on
#    port 8081, which forwards an exact allowlist of GET paths and rejects
#    every other path and every non-GET method with 403. The backend exposes
#    135 mutation endpoints; a plain client pointed at backend:8000 would
#    have network reach to all of them, so it is never given one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/tradetown.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-2.0}
      GAME_MINUTES_PER_TICK: ${GAME_MINUTES_PER_TICK:-5}
      PERSIST_INTERVAL_TICKS: ${PERSIST_INTERVAL_TICKS:-15}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - tradetown-data:/app/data
    networks:
      # `internal` only — deliberately NOT on `edge`, so the MCP service has
      # no route to this container and no DNS name for it.
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Bound to HTTP_BIND (default 127.0.0.1), never 0.0.0.0. See the
      # header comment. Set HTTP_BIND=0.0.0.0 only if you have deliberately
      # placed authentication in front of /api and /ws.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    networks:
      # Both segments: `internal` to proxy to the backend, `edge` to serve the
      # GET-allowlist listener to the MCP service.
      - internal
      - edge
    expose:
      # Internal-only GET-allowlist listener for the MCP service. Never
      # published to the host.
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-service:
    # Opt-in. `docker compose up -d` starts TradeTown exactly as before;
    # `docker compose --profile mcp up -d` additionally starts the read-only
    # boundary. Gating it this way keeps MCP_BEARER_TOKEN from becoming a
    # precondition for running TradeTown itself; the service's own startup
    # check (mcp_service/app/config.py) is what refuses to run without one.
    profiles: ["mcp"]
    build:
      context: ./mcp_service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        # service_started, NOT service_healthy. The frontend's own healthcheck
        # has been failing continuously since long before this milestone
        # (`wget -qO- http://localhost/api/health` from inside the container
        # returns "connection refused": nginx `listen 80;` binds IPv4 only,
        # while `localhost` resolves to ::1 first). That is a pre-existing bug
        # in a healthcheck, not in the proxy — the SPA and /api both work —
        # and fixing it was out of scope for this milestone. Waiting on
        # service_healthy here would mean this service never starts at all.
        condition: service_started
    environment:
      # The ONLY TradeTown address this service is ever given. Pointing it at
      # backend:8000 would hand it every mutation endpoint; the allowlist
      # listener is the boundary.
      TRADETOWN_READ_BASE_URL: http://frontend:8081
      # Bearer credential for the external agent. Env-only, never in config
      # files, never committed, never logged, never returned. Supply via a
      # root .env (gitignored). Absent => the service refuses to start.
      # Deliberately a plain default rather than `:?`: compose interpolates
      # every service's environment even for profiles that are not enabled,
      # so a required-variable form here would block `docker compose up` for
      # TradeTown itself. The fail-closed check lives in the service instead —
      # mcp_service/app/config.py raises ConfigurationError on an absent or
      # trivially short value, so the container refuses to start rather than
      # running without authentication.
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_EXTERNAL_AGENT_ID: ${MCP_EXTERNAL_AGENT_ID:-tt-scout}
      MCP_DB_PATH: /data/mcp_boundary.db
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8090
    volumes:
      - mcp-boundary-data:/data
    networks:
      # `edge` only. No route to the backend exists from here.
      - edge
    # NO `ports:` key. The MCP service is not published to the host in this
    # milestone; connecting it to OpenClaw is a separate, later step.
    expose:
      - "8090"

networks:
  # Two segments so that "the MCP service cannot reach backend:8000" is a
  # NETWORK fact, not merely an application-layer promise. Verified during
  # implementation: with a single shared network the MCP container could
  # resolve and reach backend:8000 directly, bypassing the nginx allowlist
  # entirely — which would have made the allowlist a suggestion rather than a
  # boundary.
  #
  #   internal : backend + frontend   (nginx proxies to the backend here)
  #   edge     : frontend + mcp-service  (the only place the MCP service lives)
  #
  # The backend is not attached to `edge`, so the MCP container has no route
  # to it and no DNS name for it. Its only path to TradeTown data is
  # frontend:8081, the GET-only allowlist.
  internal:
  edge:

volumes:
  tradetown-data:
  mcp-boundary-data:
