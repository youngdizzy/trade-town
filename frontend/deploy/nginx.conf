# Production nginx config baked into the frontend image. Serves the built SPA
# and reverse-proxies API/WebSocket traffic to the backend container so the
# browser only ever talks to a single origin.

# Docker's embedded DNS (127.0.0.11 on user-defined bridge networks, which
# is what Compose creates) so "backend" re-resolves periodically instead of
# being cached for the life of the nginx process. Without this, recreating
# the backend container (e.g. `docker compose up -d --build` after a code
# change) can leave nginx pointing at a stale IP until it's restarted too.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # v0.7 — Save Architecture Redesign. The real fix for the 413s this
    # limit used to cause was correcting the save POST body to the ~few KB
    # the client actually owns (see backend/app/schemas.py's
    # ClientSaveRequest) — not raising this number. It's set explicitly
    # here only as a defensive ceiling well above any legitimate request
    # this app ever sends, so a future regression fails loudly with a
    # clear 413 rather than silently growing unbounded again.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 5;
    gzip_proxied any;

    location /api/ {
        # proxy_pass through a variable forces nginx to re-resolve "backend"
        # via the resolver above instead of caching its IP for the life of
        # the process (see the comment on `resolver`). A variable target
        # disables nginx's usual location-prefix rewriting, so — unlike a
        # literal proxy_pass — this passes the request URI through
        # unmodified. That's fine here: the backend's routes already expect
        # the /api/ prefix (see backend/app/routers/save.py), so a pass-through
        # is exactly what we want; no rewriting needed.
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /assets/cute-fantasy-rpg/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================================
# TradeTown Read-Only MCP Boundary 1.0 — internal GET-allowlist listener.
#
# NOT PUBLISHED TO THE HOST. Compose `expose`s 8081 on the internal bridge
# network only; nothing maps it to a host port.
#
# WHY THIS EXISTS. The MCP service must never hold a client that can reach
# backend:8000, because the backend exposes 135 POST/PUT/PATCH/DELETE
# endpoints (POST /api/ai-reasoning/run, POST /api/runs/{id}/activate, the
# emergency-stop router, and so on). Network reach to the backend is
# all-or-nothing, so the MCP service is given reach to THIS listener instead,
# which forwards an exact allowlist of GET paths and nothing else.
#
# This is a hard, non-application-level boundary: a bug or a full compromise
# inside the MCP service still cannot reach a mutation endpoint, because
# nginx will not forward the request.
#
# Adding a path here widens the external agent's read surface. Do not add one
# without a contract version bump (docs/SCOUT_READONLY_TOOL_CONTRACT_V0.md).
# ============================================================================
server {
    listen 8081;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/mcp_allowlist.log;

    # Deny by default. Every location below re-permits exactly one path, and
    # every one of them rejects any method other than GET.
    location / {
        return 403 '{"error":{"code":"FORBIDDEN","message":"not in MCP read allowlist"}}';
        add_header Content-Type application/json always;
    }

    # `limit_except GET { deny all; }` rejects every other verb — including
    # HEAD's siblings POST/PUT/PATCH/DELETE — with 403 before proxy_pass is
    # ever reached. (Verified live: `deny all` answers 403, not 405.)
    location = /api/health {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/runs/active {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/market/timeframes {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/market/candles {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/market/data-provenance {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/mcp-read/approved-research {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/mcp-read/approved-memory {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location = /api/mcp-read/agent-findings {
        limit_except GET { deny all; }
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }
}
