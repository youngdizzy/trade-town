# Production nginx config baked into the frontend image. Serves the built SPA
# and reverse-proxies API/WebSocket traffic to the backend container so the
# browser only ever talks to a single origin.

# Docker's embedded DNS (127.0.0.11 on user-defined bridge networks, which
# is what Compose creates) so "backend" re-resolves periodically instead of
# being cached for the life of the nginx process. Without this, recreating
# the backend container (e.g. `docker compose up -d --build` after a code
# change) can leave nginx pointing at a stale IP until it's restarted too.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # v0.7 — Save Architecture Redesign. The real fix for the 413s this
    # limit used to cause was correcting the save POST body to the ~few KB
    # the client actually owns (see backend/app/schemas.py's
    # ClientSaveRequest) — not raising this number. It's set explicitly
    # here only as a defensive ceiling well above any legitimate request
    # this app ever sends, so a future regression fails loudly with a
    # clear 413 rather than silently growing unbounded again.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 5;
    gzip_proxied any;

    location /api/ {
        # proxy_pass through a variable forces nginx to re-resolve "backend"
        # via the resolver above instead of caching its IP for the life of
        # the process (see the comment on `resolver`). A variable target
        # disables nginx's usual location-prefix rewriting, so — unlike a
        # literal proxy_pass — this passes the request URI through
        # unmodified. That's fine here: the backend's routes already expect
        # the /api/ prefix (see backend/app/routers/save.py), so a pass-through
        # is exactly what we want; no rewriting needed.
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /assets/cute-fantasy-rpg/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
